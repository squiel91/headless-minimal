<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Algo salió mal</title>
		<style>
			/* Shown when even the layout fails (e.g. the Store API is down), so no app CSS is available. */
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				font-family: ui-sans-serif, system-ui, sans-serif;
				color: #0a0a0a;
				background: #fff;
			}
			main {
				width: 100%;
				max-width: 90rem;
				margin: 0 auto;
				padding: 4rem clamp(1rem, 4vw, 3rem);
				box-sizing: border-box;
			}
			p.label {
				margin: 0 0 2rem;
				font-size: 0.75rem;
				font-weight: 500;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: #6b6b6b;
			}
			h1 {
				margin: 0;
				max-width: 14ch;
				font-size: clamp(3.25rem, 10vw, 9rem);
				line-height: 0.92;
				letter-spacing: -0.045em;
				font-weight: 500;
			}
			p.text {
				margin: 3rem 0 0;
				max-width: 28rem;
				font-size: 1.25rem;
				line-height: 1.6;
				color: #6b6b6b;
			}
			a {
				display: inline-block;
				margin-top: 2.5rem;
				padding: 1rem 1.75rem;
				background: #0a0a0a;
				color: #fff;
				font-weight: 500;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="label">Error %sveltekit.status%</p>
			<h1>Algo salió mal.</h1>
			<p class="text">Tuvimos un problema al cargar la tienda. Probá de nuevo en unos minutos.</p>
			<a href="/">Reintentar</a>
		</main>
	</body>
</html>
